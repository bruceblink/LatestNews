name: Electron desktop

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "README*"
      - "LICENSE*"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "README*"
      - "LICENSE*"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: electron-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build and check Windows desktop
    # This runner keeps VS 2022, supported by pnpm's bundled node-gyp 11.5.
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check shared web and Electron code
        run: |
          pnpm lint:check
          pnpm typecheck
          pnpm test --run
          pnpm typecheck:electron
          pnpm build
          pnpm electron:build
          pnpm test:electron

      - name: Package Windows installer
        run: pnpm electron:package:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: latestnews-windows-${{ github.sha }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
