services:
  latestnews:
    container_name: latestnews
    build:
      context: .
      args:
        VITE_APP_TITLE: LatestNews
        VITE_NEWS_API_URL: ${VITE_NEWS_API_URL:-}
    ports:
      - "4444:4444"
    volumes:
      - newsnow_data:/usr/app/.data
    environment:
      # ⚠️ 只放「运行时」变量（Node / Nitro 用）
      NODE_ENV: production
      PORT: 4444
      INIT_TABLE: true
      ENABLE_CACHE: true
      JWT_SECRET: ${JWT_SECRET}
      VITE_API_URL: ${VITE_API_URL}
      LATESTNEWS_WEB_ORIGINS: ${LATESTNEWS_WEB_ORIGINS:-}
      # Optional Node-side plugins. Their bundles live under the persistent .data volume.
      LATESTNEWS_CRAWLER_PLUGIN_IDS: ${LATESTNEWS_CRAWLER_PLUGIN_IDS:-}
      LATESTNEWS_CRAWLER_PLUGIN_DIR: ${LATESTNEWS_CRAWLER_PLUGIN_DIR:-}
    restart: unless-stopped

volumes:
  newsnow_data:
    name: newsnow_data
