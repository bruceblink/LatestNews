name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create or use for this run
        required: true
        type: string
      artifact_run_id:
        description: Completed matching-tag run to reuse after a publishing-only failure
        required: false
        type: string

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare-tag:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Prepare release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
      created: ${{ steps.tag.outputs.created }}
    steps:
      - name: Check out workflow source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Create or reuse remote tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
          RELEASE_TAG_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          python3 scripts/prepare_release_tag.py "$RELEASE_TAG"

  release-context:
    needs: prepare-tag
    if: ${{ always() && (needs.prepare-tag.result == 'success' || needs.prepare-tag.result == 'skipped') && needs.prepare-tag.outputs.created != 'true' }}
    name: Verify remote release context
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.context.outputs.commit }}
      docker: ${{ steps.context.outputs.docker }}
    steps:
      - name: Check out workflow revision and remote tags
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test immutable release guard
        run: python3 -m unittest discover -s tests -p test_immutable_release.py

      - name: Check remote tag, source run and immutable settings
        id: context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ADMIN_TOKEN: ${{ secrets.RELEASE_ADMIN_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.artifact_run_id }}
          RELEASE_REF: refs/tags/${{ env.RELEASE_TAG }}
          RELEASE_WORKFLOW_SHA: ${{ needs.prepare-tag.outputs.commit || github.sha }}
        run: python3 scripts/immutable_release.py preflight

  verify:
    needs: release-context
    if: ${{ github.event_name == 'push' || inputs.artifact_run_id == '' }}
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-context.outputs.commit }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm

      - name: Check tag and package version
        run: |
          node -e 'const { version } = require("./package.json"); if (process.env.RELEASE_TAG !== `v${version}`) { throw new Error(`Tag ${process.env.RELEASE_TAG} does not match package version ${version}`); }'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run source checks
        run: |
          pnpm lint:check
          pnpm typecheck
          pnpm typecheck:electron
          pnpm test --run
          pnpm test:electron

  desktop:
    if: ${{ github.event_name == 'push' || inputs.artifact_run_id == '' }}
    name: Build ${{ matrix.label }}
    needs: [release-context, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            label: Windows x64
            runner: windows-latest
            platform: win
            arch: x64
            arch_flag: x64
          - id: windows-arm64
            label: Windows ARM64
            runner: windows-11-arm
            platform: win
            arch: arm64
            arch_flag: arm64
          - id: macos-arm64
            label: macOS Apple Silicon
            runner: macos-15
            platform: mac
            arch: arm64
            arch_flag: arm64
          - id: linux-x64
            label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
            arch_flag: x64
          - id: linux-arm64
            label: Linux ARM64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            arch_flag: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-context.outputs.commit }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          architecture: ${{ matrix.arch }}
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild electron

      - name: Build Electron application
        run: pnpm electron:build

      - name: Verify Electron license bundle
        run: node scripts/verify-license-bundle.mjs out electron

      - name: Package desktop application
        run: pnpm exec electron-builder --projectDir out --config ../electron-builder.yml --${{ matrix.platform }} --${{ matrix.arch_flag }} --publish never

      - name: Upload desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.id }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14

  web:
    if: ${{ github.event_name == 'push' || inputs.artifact_run_id == '' }}
    name: Build Web deployment package
    needs: [release-context, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-context.outputs.commit }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web application
        run: pnpm build

      - name: Package Web server and static assets
        run: |
          mkdir -p release-web
          cp -R dist/output release-web/output
          cp LICENSE LICENSE.md release-web/
          mkdir -p release-web/LICENSES
          cp LICENSES/*.txt release-web/LICENSES/
          printf 'LatestNews %s Web deployment package\n\nSource code: https://github.com/bruceblink/LatestNews/tree/%s\nBuild and deployment: https://github.com/bruceblink/LatestNews/blob/%s/docs/deployment.md\n\nRun with Node.js 22 or newer:\n  node output/server/index.mjs\n\nLicense: LICENSE.md and LICENSES/\n' "${RELEASE_TAG#v}" "${RELEASE_TAG}" "${RELEASE_TAG}" > release-web/README.txt
          node scripts/verify-license-bundle.mjs release-web
          cd release-web
          zip -r "../LatestNews-${RELEASE_TAG#v}-Web.zip" .

      - name: Upload Web package
        uses: actions/upload-artifact@v4
        with:
          name: web-${{ env.RELEASE_TAG }}
          path: LatestNews-*-Web.zip
          if-no-files-found: error
          retention-days: 14

  docker:
    if: ${{ github.event_name == 'push' || inputs.artifact_run_id == '' }}
    name: Publish multi-architecture Docker image
    needs: [release-context, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-context.outputs.commit }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,value=${{ env.RELEASE_TAG }},pattern={{version}}
            type=raw,value=latest

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish:
    if: ${{ !cancelled() && needs.release-context.result == 'success' && (inputs.artifact_run_id != '' || (needs.verify.result == 'success' && needs.desktop.result == 'success' && needs.web.result == 'success' && needs.docker.result == 'success')) }}
    name: Publish GitHub Release
    needs: [release-context, verify, desktop, web, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-context.outputs.commit }}
          fetch-depth: 0

      - name: Check release tag and source package version
        env:
          RELEASE_COMMIT: ${{ needs.release-context.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$RELEASE_COMMIT"
          node -e 'const { version } = require("./package.json"); if (process.env.RELEASE_TAG !== `v${version}`) throw new Error("Release tag does not match package version");'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate release notes from the tag range
        run: |
          python3 .github/scripts/generate_release_notes.py \
            --tag "${RELEASE_TAG}" \
            --output release-notes.md

      - name: Check out current publishing checks
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: scripts/immutable_release.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Recover source artifacts and verify ZIP digests
        if: inputs.artifact_run_id
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.artifact_run_id }}
          RELEASE_COMMIT: ${{ needs.release-context.outputs.commit }}
        run: python3 .release-tools/scripts/immutable_release.py recover

      - name: Download desktop release packages
        if: ${{ !inputs.artifact_run_id }}
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: desktop-*
          path: desktop-inputs
          merge-multiple: false

      - name: Download Web release package
        if: ${{ !inputs.artifact_run_id }}
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: web-${{ env.RELEASE_TAG }}
          path: release-assets

      - name: Remove packaging logs from recovered artifacts
        run: find desktop-inputs -type f -name 'builder-debug.yml' -delete

      - name: Record recovered Docker limitation
        if: inputs.artifact_run_id && needs.release-context.outputs.docker != 'success'
        run: |
          cat >> release-notes.md <<'EOF'

          ### 发布验证 / Release Verification

          - Web package and six desktop targets passed the source release workflow.
          - The source Docker job was not successful. This recovered release does not publish a new Docker image.
          EOF

      - name: Set up pnpm for update metadata
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Set up Node.js for update metadata
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm

      - name: Install metadata dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Merge and verify update metadata and checksums
        run: node scripts/prepare-update-assets.mjs desktop-inputs release-assets

      - name: Verify, upload and publish immutable draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ADMIN_TOKEN: ${{ secrets.RELEASE_ADMIN_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.artifact_run_id }}
          RELEASE_COMMIT: ${{ needs.release-context.outputs.commit }}
        run: python3 .release-tools/scripts/immutable_release.py finalize
