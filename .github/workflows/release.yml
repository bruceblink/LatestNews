name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and publish
        required: true
        type: string
      artifact_run_id:
        description: Completed release run to reuse after a publishing-only failure
        required: false
        type: string

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ !inputs.artifact_run_id }}
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check tag and package version
        run: |
          node -e 'const { version } = require("./package.json"); if (process.env.RELEASE_TAG !== `v${version}`) { throw new Error(`Tag ${process.env.RELEASE_TAG} does not match package version ${version}`); }'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run source checks
        run: |
          pnpm lint:check
          pnpm typecheck
          pnpm typecheck:electron
          pnpm test --run
          pnpm test:electron

  desktop:
    if: ${{ !inputs.artifact_run_id }}
    name: Build ${{ matrix.label }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            label: Windows x64
            runner: windows-latest
            platform: win
            arch: x64
            arch_flag: x64
          - id: windows-arm64
            label: Windows ARM64
            runner: windows-11-arm
            platform: win
            arch: arm64
            arch_flag: arm64
          - id: macos-x64
            label: macOS Intel
            runner: macos-15-intel
            platform: mac
            arch: x64
            arch_flag: x64
          - id: macos-arm64
            label: macOS Apple Silicon
            runner: macos-15
            platform: mac
            arch: arm64
            arch_flag: arm64
          - id: linux-x64
            label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
            arch_flag: x64
          - id: linux-arm64
            label: Linux ARM64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            arch_flag: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild electron

      - name: Build Electron application
        run: pnpm electron:build

      - name: Package desktop application
        run: pnpm exec electron-builder --projectDir out --config ../electron-builder.yml --${{ matrix.platform }} --${{ matrix.arch_flag }} --publish never

      - name: Upload desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.id }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14

  web:
    if: ${{ !inputs.artifact_run_id }}
    name: Build Web deployment package
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web application
        run: pnpm build

      - name: Package Web server and static assets
        run: |
          mkdir -p release-web
          cp -R dist/output release-web/output
          cp LICENSE LICENSE.md release-web/
          mkdir -p release-web/LICENSES
          cp LICENSES/*.txt release-web/LICENSES/
          printf 'LatestNews %s Web deployment package\n\nRun with Node.js 22 or newer:\n  node output/server/index.mjs\n' "${RELEASE_TAG#v}" > release-web/README.txt
          cd release-web
          zip -r "../LatestNews-${RELEASE_TAG#v}-Web.zip" .

      - name: Upload Web package
        uses: actions/upload-artifact@v4
        with:
          name: web-${{ env.RELEASE_TAG }}
          path: LatestNews-*-Web.zip
          if-no-files-found: error
          retention-days: 14

  docker:
    if: ${{ !inputs.artifact_run_id }}
    name: Publish multi-architecture Docker image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,value=${{ env.RELEASE_TAG }},pattern={{version}}
            type=raw,value=latest

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish:
    if: ${{ always() && (inputs.artifact_run_id || (needs.verify.result == 'success' && needs.desktop.result == 'success' && needs.web.result == 'success' && needs.docker.result == 'success')) }}
    name: Publish GitHub Release
    needs: [verify, desktop, web, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Check release tag and package version
        run: |
          git show-ref --verify "refs/tags/${RELEASE_TAG}"
          node -e 'const { version } = require("./package.json"); if (process.env.RELEASE_TAG !== `v${version}`) throw new Error("Release tag does not match package version");'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate release notes from the tag range
        run: |
          python3 .github/scripts/generate_release_notes.py \
            --tag "${RELEASE_TAG}" \
            --output release-notes.md

      - name: Download desktop release packages
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: desktop-*
          path: desktop-inputs
          merge-multiple: false

      - name: Download Web release package
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: web-${{ env.RELEASE_TAG }}
          path: release-assets

      - name: Remove packaging logs from recovered artifacts
        run: find desktop-inputs -type f -name 'builder-debug.yml' -delete

      - name: Check out current publishing checks
        if: inputs.artifact_run_id
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: scripts/verify-release-run.mjs
          sparse-checkout-cone-mode: false

      - name: Verify recovered run
        if: inputs.artifact_run_id
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.artifact_run_id }}
        run: node .release-tools/scripts/verify-release-run.mjs "$SOURCE_RUN_ID" "Verify release source" "Build Web deployment package" "Publish multi-architecture Docker image" "Build Windows x64" "Build Windows ARM64" "Build macOS Intel" "Build macOS Apple Silicon" "Build Linux x64" "Build Linux ARM64"

      - name: Set up pnpm for update metadata
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Set up Node.js for update metadata
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install metadata dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Merge and verify update metadata and checksums
        run: node scripts/prepare-update-assets.mjs desktop-inputs release-assets

      - name: Publish GitHub release and assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: false
