name: Release guard regression

on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/release-guard.yml'
      - 'scripts/immutable_release.py'
      - 'tests/test_immutable_release.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/release-guard.yml'
      - 'scripts/immutable_release.py'
      - 'tests/test_immutable_release.py'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -p test_immutable_release.py -v
